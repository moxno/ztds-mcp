name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run ZTDS protocol self-tests
        run: node test.js

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-arch OCI image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/ztds-mcp:latest
            ${{ vars.DOCKERHUB_USERNAME }}/ztds-mcp:1.2.2
            ${{ vars.DOCKERHUB_USERNAME }}/ztds-mcp:1.2
            ${{ vars.DOCKERHUB_USERNAME }}/ztds-mcp:1

      - name: Update Docker Hub description and Overview README
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_USERNAME }}/ztds-mcp
          short-description: Open standard MCP server for Zero-Trust Data Sanitization (ZTDS RFC v1.0). Local in-RAM PII guard.
          readme-filepath: ./README.md
